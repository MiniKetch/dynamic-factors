[build-system]
requires = [
    "scikit-build-core>=0.7",
    "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "dynamic-factors"
version = "0.1.0"
description = "Dynamic factor model for equity stat-arb — PCA + Kalman filtering, C++ kernel + Python orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alex" }]
keywords = ["pca", "kalman", "stat-arb", "factor-model", "quant", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2.40",
    "fredapi>=0.5",
]
viz = [
    "plotly>=5.20",
    "scipy>=1.11",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.20",
    "kaleido>=0.2.1",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/MiniKetch/dynamic-factors"

[tool.scikit-build]
cmake.args = [
    "-DDF_BUILD_PYTHON=ON",
    "-DDF_BUILD_TESTS=OFF",
]
wheel.packages = ["python/dynamic_factors"]
cmake.version = ">=3.20"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
